# =========================================================
# virtual_devices_administrativa.yaml — Área Administrativa
# =========================================================
# Pegar DENTRO del mismo virtual.yaml que ya usan las otras 3 áreas.
#
# 2 zonas climáticas independientes: Área Administrativa (más
# grande, 2 aires de 24.000 BTU) y Oficina del Director/a
# (más chica, 1 aire de 12.000 BTU). Según tablero: 20 luces
# en 1 circuito compartido, 7 tomas, 3 ventiladores, 3 aires.

  # ---------------- ILUMINACIÓN (2 zonas, circuito compartido C-1) ----------------
  Administrativa Iluminacion Zona Area:
    - platform: light
      name: administrativa iluminacion zona area
  Administrativa Iluminacion Zona Oficina:
    - platform: light
      name: administrativa iluminacion zona oficina

  # ---------------- VENTILADORES (3) ----------------
  Administrativa Ventilador AA 1:
    - platform: fan
      name: administrativa ventilador aa 1
      speed_count: 3
  Administrativa Ventilador AA 2:
    - platform: fan
      name: administrativa ventilador aa 2
      speed_count: 3
  Administrativa Ventilador OD 1:
    - platform: fan
      name: administrativa ventilador od 1
      speed_count: 3

  # ---------------- AIRES (switches base, 3) ----------------
  Administrativa Aire AA 1:
    - platform: switch
      name: administrativa aire aa 1
  Administrativa Aire AA 2:
    - platform: switch
      name: administrativa aire aa 2
  Administrativa Aire OD 1:
    - platform: switch
      name: administrativa aire od 1

  # ---------------- TOMACORRIENTES (7) ----------------
  Administrativa Toma AA 01:
    - platform: switch
      name: administrativa toma aa 01
  Administrativa Toma AA 02:
    - platform: switch
      name: administrativa toma aa 02
  Administrativa Toma AA 03:
    - platform: switch
      name: administrativa toma aa 03
  Administrativa Toma AA 04:
    - platform: switch
      name: administrativa toma aa 04
  Administrativa Toma OD 01:
    - platform: switch
      name: administrativa toma od 01
  Administrativa Toma OD 02:
    - platform: switch
      name: administrativa toma od 02
  Administrativa Toma OD 03:
    - platform: switch
      name: administrativa toma od 03

  # ---------------- SENSORES AMBIENTALES (por zona) ----------------
  Administrativa Temperatura AA:
    - platform: sensor
      name: temperatura aa
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 24
  Administrativa Humedad AA:
    - platform: sensor
      name: humedad aa
      class: humidity
      unit_of_measurement: "%"
      initial_value: 50
  Administrativa Temperatura OD:
    - platform: sensor
      name: temperatura od
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 24
  Administrativa Humedad OD:
    - platform: sensor
      name: humedad od
      class: humidity
      unit_of_measurement: "%"
      initial_value: 50

  # ---------------- PRESENCIA Y ACCESOS ----------------
  Administrativa Presencia AA:
    - platform: binary_sensor
      name: presencia aa
      class: occupancy
      initial_value: 'off'
  Administrativa Presencia OD:
    - platform: binary_sensor
      name: presencia od
      class: occupancy
      initial_value: 'off'
  Administrativa Puerta Oficina:
    - platform: binary_sensor
      name: puerta oficina director
      class: door
      initial_value: 'off'

  # ---------------- PROTECCIÓN ELÉCTRICA (2 zonas + BASIC-1GSP) ----------------
  Administrativa Voltaje AA:
    - platform: sensor
      name: voltaje aa
      class: voltage
      unit_of_measurement: "V"
      initial_value: 220
  Administrativa Corriente AA:
    - platform: sensor
      name: corriente aa
      class: current
      unit_of_measurement: "A"
      initial_value: 10
  Administrativa Corte AA:
    - platform: switch
      name: corte aa administrativa

  Administrativa Voltaje OD:
    - platform: sensor
      name: voltaje od
      class: voltage
      unit_of_measurement: "V"
      initial_value: 220
  Administrativa Corriente OD:
    - platform: sensor
      name: corriente od
      class: current
      unit_of_measurement: "A"
      initial_value: 5
  Administrativa Corte OD:
    - platform: switch
      name: corte od administrativa