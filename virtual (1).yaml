# =========================================================
# virtual_devices_biblioteca.yaml
# =========================================================
# Estructura simulada de la Biblioteca REAL:
# 8 portafluorescentes (4x40) en 4 zonas de 2 fixtures c/u,
# 3 aires, 2 ventiladores de techo, 8 tomas, presencia,
# temp/humedad, luminosidad y apertura de puertas/ventanas.
#
# LUCES: ON/OFF puro, sin regulación de intensidad — así es
# como se comporta el hardware real elegido (Sonoff ZBMINIL2,
# ver manual). Los fluorescentes normales no se pueden atenuar
# salvo que se instalen balastos regulables (0-10V o DALI),
# que no forman parte de este proyecto. La simulación queda
# así fiel a lo que se va a instalar.

version: 1
devices:

  # ---------------- ILUMINACIÓN (4 zonas, ON/OFF) ----------------
  Biblioteca Iluminacion Zona 1:
    - platform: light
      name: iluminacion zona 1

  Biblioteca Iluminacion Zona 2:
    - platform: light
      name: iluminacion zona 2

  Biblioteca Iluminacion Zona 3:
    - platform: light
      name: iluminacion zona 3

  Biblioteca Iluminacion Zona 4:
    - platform: light
      name: iluminacion zona 4

  # ---------------- AIRES ACONDICIONADOS (switches base) ----------------
  Biblioteca Aire 1:
    - platform: switch
      name: aire 1

  Biblioteca Aire 2:
    - platform: switch
      name: aire 2

  Biblioteca Aire 3:
    - platform: switch
      name: aire 3

  Biblioteca Deshumidificador:
    - platform: switch
      name: deshumidificador biblioteca

  # ---------------- VENTILADORES DE TECHO ----------------
  Biblioteca Ventilador Techo 1:
    - platform: fan
      name: ventilador 1
      speed_count: 3
      oscillate: false

  Biblioteca Ventilador Techo 2:
    - platform: fan
      name: ventilador 2
      speed_count: 3
      oscillate: false

  # ---------------- TOMACORRIENTES (8) ----------------
  Biblioteca Toma 01:
    - platform: switch
      name: toma 01
  Biblioteca Toma 02:
    - platform: switch
      name: toma 02
  Biblioteca Toma 03:
    - platform: switch
      name: toma 03
  Biblioteca Toma 04:
    - platform: switch
      name: toma 04
  Biblioteca Toma 05:
    - platform: switch
      name: toma 05
  Biblioteca Toma 06:
    - platform: switch
      name: toma 06
  Biblioteca Toma 07:
    - platform: switch
      name: toma 07
  Biblioteca Toma 08:
    - platform: switch
      name: toma 08

  # ---------------- SENSORES AMBIENTALES ----------------
  Biblioteca Temperatura:
    - platform: sensor
      name: temperatura biblioteca
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 24

  Biblioteca Humedad:
    - platform: sensor
      name: humedad biblioteca
      class: humidity
      unit_of_measurement: "%"
      initial_value: 50

  Biblioteca Luminosidad:
    - platform: sensor
      name: luminosidad biblioteca
      class: illuminance
      unit_of_measurement: "lx"
      initial_value: 300

  # ---------------- PRESENCIA Y ACCESOS ----------------
  Biblioteca Presencia:
    - platform: binary_sensor
      name: presencia biblioteca
      class: occupancy
      initial_value: 'off'

  Biblioteca Puerta Principal:
    - platform: binary_sensor
      name: puerta principal biblioteca
      class: door
      initial_value: 'off'

  Biblioteca Ventana:
    - platform: binary_sensor
      name: ventana biblioteca
      class: window
      initial_value: 'off'

  Biblioteca Humo:
    - platform: binary_sensor
      name: humo biblioteca
      class: smoke
      initial_value: 'off'

  Biblioteca CO2:
    - platform: sensor
      name: co2 biblioteca
      class: carbon_dioxide
      unit_of_measurement: "ppm"
      initial_value: 450


# =========================================================
# virtual_devices_lab.yaml
# =========================================================
# Dispositivos virtuales del Laboratorio de Informática.
#
# IMPORTANTE: agregá este bloque de "devices:" DENTRO del
# mismo archivo virtual.yaml que ya usa tu integración Virtual
# para la Biblioteca (pegalo debajo de "devices:", al mismo
# nivel que "Biblioteca Aire 1", etc.) — NO crees una integración
# Virtual nueva, solo sumá estos dispositivos a la que ya existe.
#
# Según el tablero de cargas: 16 tubos (4 luminarias 4x40W),
# 17 tomas, 4 ventiladores, 2 aires de 24.000 BTU.

  # ---------------- ILUMINACIÓN (2 zonas, ON/OFF) ----------------
  # Zona Pizarrón: las 2 luminarias más cercanas a la pantalla de
  # proyección (se atenúan/apagan en Modo Proyección).
  # Zona General: las otras 2 luminarias del resto de la sala.
  Lab Iluminacion Zona Pizarron:
    - platform: light
      name: lab iluminacion zona pizarron

  Lab Iluminacion Zona General:
    - platform: light
      name: lab iluminacion zona general

  # ---------------- VENTILADORES (4) ----------------
  Lab Ventilador 1:
