  # ---------------- AIRES ACONDICIONADOS (switches base) ----------------
  Lab Aire 1:
    - platform: switch
      name: lab aire 1

  Lab Aire 2:
    - platform: switch
      name: lab aire 2

  # ---------------- TOMACORRIENTES (17) ----------------
  Lab Toma 01:
    - platform: switch
      name: lab toma 01
  Lab Toma 02:
    - platform: switch
      name: lab toma 02
  Lab Toma 03:
    - platform: switch
      name: lab toma 03
  Lab Toma 04:
    - platform: switch
      name: lab toma 04
  Lab Toma 05:
    - platform: switch
      name: lab toma 05
  Lab Toma 06:
    - platform: switch
      name: lab toma 06
  Lab Toma 07:
    - platform: switch
      name: lab toma 07
  Lab Toma 08:
    - platform: switch
      name: lab toma 08
  Lab Toma 09:
    - platform: switch
      name: lab toma 09
  Lab Toma 10:
    - platform: switch
      name: lab toma 10
  Lab Toma 11:
    - platform: switch
      name: lab toma 11
  Lab Toma 12:
    - platform: switch
      name: lab toma 12
  Lab Toma 13:
    - platform: switch
      name: lab toma 13
  Lab Toma 14:
    - platform: switch
      name: lab toma 14
  Lab Toma 15:
    - platform: switch
      name: lab toma 15
  Lab Toma 16:
    - platform: switch
      name: lab toma 16
  Lab Toma 17:
    - platform: switch
      name: lab toma 17

  # ---------------- SENSORES AMBIENTALES ----------------
  Lab Temperatura:
    - platform: sensor
      name: temperatura lab
      class: temperature
      unit_of_measurement: "°C"
      initial_value: 24

  Lab Humedad:
    - platform: sensor
      name: humedad lab
      class: humidity
