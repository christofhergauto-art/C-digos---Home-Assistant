# =========================================================
# SEGURIDAD Y EFICIENCIA ADICIONALES
# =========================================================

# ---------------------------------------------------------
# 6) Humo detectado: pasa a modo "Emergencia" (siempre activo,
#    sin importar el modo actual ni el interruptor general)
# ---------------------------------------------------------
- id: multiusos_humo_detectado
  alias: "Multiusos - 🔥 Humo detectado"
  trigger:
    - platform: state
      entity_id: binary_sensor.humo_multiusos
      to: "on"
  action:
    - service: input_select.select_option
      target:
        entity_id: input_select.multiusos_modo_salon
      data:
        option: "Emergencia"
    - service: persistent_notification.create
      data:
        title: "🔥 ALERTA - Humo detectado en el Salón Multiusos"
        message: "Se activó el modo Emergencia: luces encendidas, aires y ventiladores apagados, sistema audiovisual apagado."
  mode: single

# ---------------------------------------------------------
# 7) Consumo eléctrico elevado (capacidad instalada: 12.500W)
# ---------------------------------------------------------
- id: multiusos_consumo_alto
  alias: "Multiusos - ⚡ Consumo eléctrico elevado"
  trigger:
    - platform: numeric_state
      entity_id: sensor.consumo_total_multiusos
      above: 10500
      for: "00:05:00"
  action:
    - service: persistent_notification.create
      data:
        title: "⚡ Consumo elevado"
        message: "El consumo del Salón Multiusos superó los 10.500W durante 5 minutos seguidos (cerca de la capacidad máxima). Revisar equipos."
  mode: single

# ---------------------------------------------------------
# 8) Apagado automático de tomas por inactividad (30 min)
# ---------------------------------------------------------
- id: multiusos_apagado_tomas_inactividad
  alias: "Multiusos - Apagar tomas por inactividad prolongada"
  trigger:
    - platform: state
      entity_id: binary_sensor.presencia_multiusos
      to: "off"
      for: "00:30:00"
  condition:
    - condition: state
      entity_id: input_boolean.multiusos_apagado_automatico_tomas
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id:
          - switch.multiusos_toma_01
          - switch.multiusos_toma_02
          - switch.multiusos_toma_03
          - switch.multiusos_toma_04
          - switch.multiusos_toma_05
          - switch.multiusos_toma_06
          - switch.multiusos_toma_07
          - switch.multiusos_toma_08
    - service: persistent_notification.create
      data:
        title: "Multiusos - Ahorro de energía"
        message: "30 minutos sin presencia: se apagaron las tomas automáticamente."
  mode: single

# ---------------------------------------------------------
# 9) Luces por luz natural — solo en modo "Reunión"
# ---------------------------------------------------------
- id: multiusos_luz_natural_suficiente
  alias: "Multiusos - Apagar luces por luz natural suficiente"
  trigger:
    - platform: numeric_state
      entity_id: sensor.luminosidad_multiusos
      above: 500
  condition:
    - condition: state
      entity_id: binary_sensor.presencia_multiusos
      state: "on"
    - condition: state
      entity_id: input_select.multiusos_modo_salon
      state: "Reunión"
  action:
    - service: light.turn_off
      target:
        entity_id:
          - light.multiusos_iluminacion_zona_1
          - light.multiusos_iluminacion_zona_2
          - light.multiusos_iluminacion_zona_3
          - light.multiusos_iluminacion_zona_4
  mode: single

- id: multiusos_luz_natural_insuficiente
  alias: "Multiusos - Encender luces por poca luz natural"
  trigger:
    - platform: numeric_state
      entity_id: sensor.luminosidad_multiusos
      below: 200
  condition:
    - condition: state
      entity_id: binary_sensor.presencia_multiusos
      state: "on"
    - condition: state
      entity_id: input_select.multiusos_modo_salon
      state: "Reunión"
  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.multiusos_iluminacion_zona_1
          - light.multiusos_iluminacion_zona_2
          - light.multiusos_iluminacion_zona_3
          - light.multiusos_iluminacion_zona_4
  mode: single

# ---------------------------------------------------------
# 10) SIMULACIÓN: sincronizar humo y luminosidad
# ---------------------------------------------------------
- id: multiusos_sim_humo
  alias: "Multiusos - Sincronizar simulación de humo"
  trigger:
    - platform: state
      entity_id: input_boolean.multiusos_simular_humo
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.multiusos_simular_humo
              state: "on"
          sequence:
            - service: virtual.turn_on
              target:
                entity_id: binary_sensor.humo_multiusos
      default:
        - service: virtual.turn_off
          target:
            entity_id: binary_sensor.humo_multiusos
  mode: single

- id: multiusos_sim_luminosidad
  alias: "Multiusos - Sincronizar simulación de luminosidad"
  trigger:
    - platform: state
      entity_id: input_number.multiusos_control_luminosidad
  action:
    - service: virtual.set
      target:
        entity_id: sensor.luminosidad_multiusos
      data:
        value: "{{ trigger.to_state.state }}"
  mode: single
  
  
  # =========================================================
# =========================================================
# automations_administrativa.yaml — Área Administrativa
# =========================================================
# Pegar al final de tu automations.yaml existente.

# =========================================================
# PROTECCIÓN ELÉCTRICA — SIEMPRE ACTIVA, EN CUALQUIER MODO
# =========================================================
# Cada BASIC-1GSP protege su propia zona de forma independiente.
# Si AMBAS zonas muestran corriente elevada AL MISMO TIEMPO, se
# interpreta como una falla en la acometida general (no en un
# circuito puntual) y se cortan las dos juntas. Ningún corte se
# restablece solo — requiere reposición manual del switch
# correspondiente.

# ---------------------------------------------------------
# Zona Área Administrativa: tensión fuera de rango
# ---------------------------------------------------------
- id: administrativa_proteccion_aa_tension
  alias: "Administrativa - ⚠️ Zona AA: tensión anormal"
  trigger:
    - platform: numeric_state
      entity_id: sensor.voltaje_aa
      below: 200
    - platform: numeric_state
      entity_id: sensor.voltaje_aa
      above: 240
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.corte_aa_administrativa
    - service: switch.turn_off
      target:
        entity_id:
          - switch.administrativa_aire_aa_1
          - switch.administrativa_aire_aa_2
          - switch.administrativa_toma_aa_01
          - switch.administrativa_toma_aa_02
          - switch.administrativa_toma_aa_03
          - switch.administrativa_toma_aa_04
    - service: fan.turn_off
      target:
        entity_id:
          - fan.administrativa_ventilador_aa_1
          - fan.administrativa_ventilador_aa_2
    - service: persistent_notification.create
      data:
        title: "⚠️ Área Administrativa - Tensión anormal"
        message: "Corte de la zona Área Administrativa activado (BASIC-1GSP AA). Revisar antes de reponer manualmente switch.corte_aa_administrativa."
  mode: single

# ---------------------------------------------------------
# Zona Área Administrativa: sobrecorriente propia
# ---------------------------------------------------------
- id: administrativa_proteccion_aa_corriente
  alias: "Administrativa - ⚠️ Zona AA: sobrecorriente"
  trigger:
    - platform: numeric_state
      entity_id: sensor.corriente_aa
      above: 28
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.corte_aa_administrativa
    - service: switch.turn_off
      target:
        entity_id:
          - switch.administrativa_aire_aa_1
          - switch.administrativa_aire_aa_2
          - switch.administrativa_toma_aa_01
          - switch.administrativa_toma_aa_02
          - switch.administrativa_toma_aa_03
          - switch.administrativa_toma_aa_04
    - service: fan.turn_off
      target:
        entity_id:
          - fan.administrativa_ventilador_aa_1
          - fan.administrativa_ventilador_aa_2
    - service: persistent_notification.create
      data:
        title: "⚠️ Área Administrativa - Sobrecorriente"
        message: "Corriente de la zona AA por encima de 28A (límite del BASIC-1GSP: 32A). Corte activado. Revisar antes de reponer manualmente."
  mode: single

# ---------------------------------------------------------
# Zona Oficina del Director: tensión fuera de rango
# ---------------------------------------------------------
- id: administrativa_proteccion_od_tension
  alias: "Administrativa - ⚠️ Zona OD: tensión anormal"
  trigger:
    - platform: numeric_state
      entity_id: sensor.voltaje_od
      below: 200
    - platform: numeric_state
      entity_id: sensor.voltaje_od
      above: 240
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.corte_od_administrativa
    - service: switch.turn_off
      target:
        entity_id:
          - switch.administrativa_aire_od_1
          - switch.administrativa_toma_od_01
          - switch.administrativa_toma_od_02
          - switch.administrativa_toma_od_03
    - service: fan.turn_off
      target:
        entity_id: fan.administrativa_ventilador_od_1
    - service: persistent_notification.create
      data:
        title: "⚠️ Oficina del Director - Tensión anormal"
        message: "Corte de la zona Oficina del Director activado (BASIC-1GSP OD). Revisar antes de reponer manualmente switch.corte_od_administrativa."
  mode: single

# ---------------------------------------------------------
# Zona Oficina del Director: sobrecorriente propia
# ---------------------------------------------------------
- id: administrativa_proteccion_od_corriente
  alias: "Administrativa - ⚠️ Zona OD: sobrecorriente"
  trigger:
    - platform: numeric_state
      entity_id: sensor.corriente_od
      above: 28
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.corte_od_administrativa
    - service: switch.turn_off
      target:
        entity_id:
          - switch.administrativa_aire_od_1
          - switch.administrativa_toma_od_01
          - switch.administrativa_toma_od_02
          - switch.administrativa_toma_od_03
    - service: fan.turn_off
      target:
        entity_id: fan.administrativa_ventilador_od_1
    - service: persistent_notification.create
      data:
        title: "⚠️ Oficina del Director - Sobrecorriente"
        message: "Corriente de la zona OD por encima de 28A. Corte activado. Revisar antes de reponer manualmente."
  mode: single

# ---------------------------------------------------------
# FALLA GENERAL: ambas zonas con corriente elevada a la vez
# -> se interpreta como problema en la acometida general,
# se cortan las 2 zonas juntas
# ---------------------------------------------------------
- id: administrativa_proteccion_general
  alias: "Administrativa - 🔴 Falla general (ambas zonas), corte total"
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.corriente_aa')|float(0) > 20
           and states('sensor.corriente_od')|float(0) > 20 }}
  action:
    - service: switch.turn_on
      target:
        entity_id:
          - switch.corte_aa_administrativa
          - switch.corte_od_administrativa
    - service: switch.turn_off
      target:
        entity_id:
          - switch.administrativa_aire_aa_1
          - switch.administrativa_aire_aa_2
          - switch.administrativa_aire_od_1
          - switch.administrativa_toma_aa_01
          - switch.administrativa_toma_aa_02
          - switch.administrativa_toma_aa_03
          - switch.administrativa_toma_aa_04
          - switch.administrativa_toma_od_01
          - switch.administrativa_toma_od_02
          - switch.administrativa_toma_od_03
    - service: fan.turn_off
      target:
        entity_id:
          - fan.administrativa_ventilador_aa_1
          - fan.administrativa_ventilador_aa_2
          - fan.administrativa_ventilador_od_1
    - service: persistent_notification.create
      data:
        title: "🔴 ALERTA GENERAL - Falla en la acometida"
        message: "Ambas zonas (AA y OD) muestran corriente elevada simultáneamente: posible falla en la acometida general del Área Administrativa. Corte total activado. Requiere revisión antes de reponer ambos switches manualmente."
  mode: single

# =========================================================
# MODOS DE OPERACIÓN
# =========================================================

# ---------------------------------------------------------
# Presencia (cualquiera de las 2 zonas): si estaba en "Ahorro",
# vuelve a "Trabajo"
# ---------------------------------------------------------
- id: administrativa_presencia_on
  alias: "Administrativa - Presencia detectada"
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.presencia_aa
        - binary_sensor.presencia_od
      to: "on"
  condition:
    - condition: state
      entity_id: input_select.administrativa_modo
      state: "Ahorro"
  action:
    - service: input_select.select_option
      target:
        entity_id: input_select.administrativa_modo
      data:
        option: "Trabajo"
  mode: single

# ---------------------------------------------------------
# Sin presencia en NINGUNA zona (2 min): pasa a "Ahorro"
# ---------------------------------------------------------
- id: administrativa_presencia_off
  alias: "Administrativa - Sin presencia, modo Ahorro"
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.presencia_aa
        - binary_sensor.presencia_od
      to: "off"
      for: "00:02:00"
  condition:
    - condition: state
      entity_id: binary_sensor.presencia_aa
      state: "off"
    - condition: state
      entity_id: binary_sensor.presencia_od
      state: "off"
    - condition: not
      conditions:
        - condition: state
          entity_id: input_select.administrativa_modo
          state: "Fuera de horario"
  action:
    - service: input_select.select_option
      target:
        entity_id: input_select.administrativa_modo
      data:
        option: "Ahorro"
  mode: single

# ---------------------------------------------------------
# Horario institucional: fuerza "Fuera de horario" al cerrar
# ---------------------------------------------------------
- id: administrativa_fuera_horario
  alias: "Administrativa - Cierre, Fuera de horario"
  trigger:
    - platform: state
      entity_id: schedule.horario_administrativa
      to: "off"
  action:
    - service: input_select.select_option
      target:
        entity_id: input_select.administrativa_modo
      data:
        option: "Fuera de horario"
  mode: single

# ---------------------------------------------------------
# Temperatura crítica (>29°C), en cualquiera de las 2 zonas
# ---------------------------------------------------------
- id: administrativa_temp_critica_aa
  alias: "Administrativa - Temp. crítica AA, programar a 25°C"
  trigger:
    - platform: numeric_state
      entity_id: sensor.temperatura_aa
      above: 29
  action:
    - service: climate.set_hvac_mode
      target:
        entity_id:
          - climate.aire_administrativa_aa_1
          - climate.aire_administrativa_aa_2
      data:
        hvac_mode: cool
    - service: climate.set_temperature
      target:
        entity_id:
          - climate.aire_administrativa_aa_1
          - climate.aire_administrativa_aa_2
      data:
        temperature: 25
  mode: single

- id: administrativa_temp_critica_od
  alias: "Administrativa - Temp. crítica OD, programar a 25°C"
  trigger:
    - platform: numeric_state
      entity_id: sensor.temperatura_od
      above: 29
  action:
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.aire_administrativa_od_1
      data:
        hvac_mode: cool
    - service: climate.set_temperature
      target:
        entity_id: climate.aire_administrativa_od_1
      data:
        temperature: 25
  mode: single

# =========================================================
# ACTUADOR: aplica el modo elegido (no actúa si hay un corte
# general activo, hasta que se resuelva la falla)
# =========================================================
- id: administrativa_aplicar_modo
  alias: "Administrativa - Aplicar modo seleccionado"
  trigger:
    - platform: state
      entity_id: input_select.administrativa_modo
  condition:
    - condition: state
      entity_id: switch.corte_aa_administrativa
      state: "off"
    - condition: state
      entity_id: switch.corte_od_administrativa
      state: "off"
  action:
    - choose:
        # ---------------- TRABAJO ----------------
        - conditions:
            - condition: state
              entity_id: input_select.administrativa_modo
              state: "Trabajo"
          sequence:
            - service: light.turn_on
              target:
                entity_id:
                  - light.administrativa_iluminacion_zona_area
                  - light.administrativa_iluminacion_zona_oficina
            - service: climate.set_hvac_mode
              target:
                entity_id:
                  - climate.aire_administrativa_aa_1
                  - climate.aire_administrativa_aa_2
                  - climate.aire_administrativa_od_1
              data:
                hvac_mode: cool
            - service: fan.turn_on
              target:
                entity_id:
                  - fan.administrativa_ventilador_aa_1
                  - fan.administrativa_ventilador_aa_2
                  - fan.administrativa_ventilador_od_1
              data:
                percentage: 33

        # ---------------- REUNIÓN ----------------
        - conditions:
            - condition: state
              entity_id: input_select.administrativa_modo
              state: "Reunión"
          sequence:
            - service: light.turn_on
              target:
                entity_id:
                  - light.administrativa_iluminacion_zona_area
                  - light.administrativa_iluminacion_zona_oficina
            - service: climate.set_hvac_mode
              target:
                entity_id:
                  - climate.aire_administrativa_aa_1
                  - climate.aire_administrativa_aa_2
                  - climate.aire_administrativa_od_1
              data:
                hvac_mode: cool
            - service: climate.set_temperature
              target:
                entity_id:
                  - climate.aire_administrativa_aa_1
                  - climate.aire_administrativa_aa_2
                  - climate.aire_administrativa_od_1
              data:
                temperature: 23
            - service: fan.turn_on
              target:
                entity_id:
                  - fan.administrativa_ventilador_aa_1
                  - fan.administrativa_ventilador_aa_2
                  - fan.administrativa_ventilador_od_1
              data:
                percentage: 20
      default:
        # ---------------- AHORRO / FUERA DE HORARIO ----------------
        - service: light.turn_off
          target:
            entity_id:
              - light.administrativa_iluminacion_zona_area
              - light.administrativa_iluminacion_zona_oficina
        - service: climate.set_hvac_mode
          target:
            entity_id:
              - climate.aire_administrativa_aa_1
              - climate.aire_administrativa_aa_2
              - climate.aire_administrativa_od_1
          data:
            hvac_mode: "off"
        - service: switch.turn_off
          target:
            entity_id:
              - switch.administrativa_aire_aa_1
              - switch.administrativa_aire_aa_2
              - switch.administrativa_aire_od_1
        - service: fan.turn_off
          target:
            entity_id:
              - fan.administrativa_ventilador_aa_1
              - fan.administrativa_ventilador_aa_2
              - fan.administrativa_ventilador_od_1
  mode: single

# =========================================================
# SIMULACIÓN
